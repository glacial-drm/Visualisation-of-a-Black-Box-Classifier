syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.blackbox.proto.connector";
option java_outer_classname = "ConnectorProto";

package connector;

service Connector {
  rpc TrainSvm (SvmRequest) returns (ModelResults);
  rpc TrainDecisionTree (DecisionTreeRequest) returns (ModelResults);
  rpc TrainRandomForest (RandomForestRequest) returns (ModelResults);
}

message Point {
  float label = 1;
  repeated float values = 2;
}

message Points {
  repeated Point points = 1;
}

message SvmRequest {
  Points points = 1;

  enum Kernel {
    LINEAR = 0;
    POLY = 1;
    RBF = 2;
    SIGMOID = 3;
  }
  Kernel kernel = 2;

  int32 polyDegree = 3;
}

// Used by both decision trees and random forest
enum Criterion {
  GINI = 0;
  ENTROPY = 1;
  LOG_LOSS = 2;
}

message DecisionTreeRequest {
  Points points = 1;

  Criterion criterion = 2;
  int32 maxDepth = 3; // -1 is None
}

message RandomForestRequest {
  Points points = 1;

  int32 nEstimators = 2;
  Criterion criterion = 3;
  int32 maxDepth = 4; // -1 is None
  float minSamplesSplit = 5; // int and float have different behaviours here
  float minSamplesLeaf = 6;  // int and float have different behaviours here

  enum MaxFeatures {
    SQRT = 0;
    LOG2 = 1;
    N_FEATURES = 2; // None in sklearn
    VALUE = 3;
  }
  MaxFeatures maxFeatures = 7;
  float maxFeaturesVal = 8;
}

message ModelResults {
  string onnxPath = 1;
}

message UiTest {
  bool boolean = 1;
  float f32 = 2;
  double f64 = 3;
  int32 i32 = 4;
  int64 i64 = 5;
  string str = 6;

  enum TestEnum {
    OPTION1 = 0;
    OPTION2 = 1;
    OPTION3 = 2;
  }
  TestEnum testEnum = 7;
}

