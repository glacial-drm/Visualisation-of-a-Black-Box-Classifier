syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.blackbox.proto.connector";
option java_outer_classname = "ConnectorProto";

package connector;

service Connector {
  rpc TrainSvm (SvmRequest) returns (ModelResults);
  rpc TrainDecisionTree (DecisionTreeRequest) returns (ModelResults);
  rpc TrainRandomForest (RandomForestRequest) returns (ModelResults);
  rpc TrainKNeighbors (KNeighborsRequest) returns (ModelResults);
  rpc TrainLogisticRegression (LogisticRegressionRequest) returns (ModelResults);
  rpc TrainMLPClassifier (MLPClassifierRequest) returns (ModelResults);
}

message Point {
  float label = 1;
  repeated float values = 2;
}

message Points {
  repeated Point points = 1;
}

message SvmRequest {
  Points points = 1;

  float c = 2;

  enum Kernel {
    LINEAR = 0;
    POLY = 1;
    RBF = 2;
    SIGMOID = 3;
  }
  Kernel kernel = 3;

  int32 polyDegree = 4;

  enum Gamma {
    SCALE = 0;
    AUTO = 1;
    VALUE = 2;
  }
  Gamma gamma = 5;
  float gammaVal = 6;

  float coef0 = 7;
  bool shrinking = 8;
  bool probability = 9;
  float tol = 10;
  float cacheSize = 11;
  int32 maxIter = 12;
  bool breakTies = 13;
  int32 randomState = 14;
}

// Used by both decision trees and random forest
enum Criterion {
  GINI = 0;
  ENTROPY = 1;
  LOG_LOSS = 2;
}

message DecisionTreeRequest {
  Points points = 1;

  Criterion criterion = 2;
  int32 maxDepth = 3; // -1 is None
}

message RandomForestRequest {
  Points points = 1;

  int32 nEstimators = 2;
  Criterion criterion = 3;
  int32 maxDepth = 4; // -1 is None
  float minSamplesSplit = 5; // int and float have different behaviours here
  float minSamplesLeaf = 6;  // int and float have different behaviours here

  enum MaxFeatures {
    SQRT = 0;
    LOG2 = 1;
    N_FEATURES = 2; // None in sklearn
    VALUE = 3;
  }
  MaxFeatures maxFeatures = 7;
  float maxFeaturesVal = 8;
}

message KNeighborsRequest {

  Points points = 1;

  int32 nNeighbors = 2;

  enum Weights {
    UNIFORM = 0;
    DISTANCE = 1;
  }
  Weights weights = 3;

  enum Algorithm {
    AUTO = 0;
    BALL_TREE = 1;
    KD_TREE = 2;
    BRUTE = 3;
  }
  Algorithm algorithm = 4;

  int32 leaf_size = 5;
  float p = 6;

  enum Metric {
    CITYBLOCK = 0;
    COSINE = 1;
    EUCLIDEAN = 2;
    L1 = 3;
    L2 = 4;
    MANHATTAN = 5;
    MINKOWSKI = 6;
  }
  Metric metric = 7;
  int32 nJobs = 8;

}

message MLPClassifierRequest {
  Points points = 1;

  enum Activation {
    relu = 0;
    identity = 1;
    logistic = 2;
    tanh = 3;
  }
  Activation activation = 2;

  enum Solver {
    adam = 0;
    lbfgs = 1;
    sgd = 2;
  }

  Solver solver = 3;

  float alpha = 4;

  string hidden_layers = 5;
}

message LogisticRegressionRequest {

  Points points = 1;

  enum Penalty {
    NONE = 0;
    L1 = 1;
    L2 = 2;
    ELASTICNET = 3;
  }
  Penalty penalty = 2;
  bool dual = 3;
  float tol = 4;
  float C = 5;
  bool fit_intercept = 6;
  float intercept_scaling = 7;
  int32 random_state = 8;

  enum Solver {
    LBFGS = 0;
    LIBLINEAR = 1;
    NEWTON_CG = 2;
    NEWTON_CHOLESKY = 3;
    SAG = 4;
    SAGA = 5;
  }
  Solver solver = 9;
  int32 max_iter = 10;

  bool warm_start = 11;
  int32 nJobs = 12;
}

message ModelResults {
  string onnxPath = 1;
}

message UiTest {
  bool boolean = 1;
  float f32 = 2;
  double f64 = 3;
  int32 i32 = 4;
  int64 i64 = 5;
  string str = 6;

  enum TestEnum {
    OPTION1 = 0;
    OPTION2 = 1;
    OPTION3 = 2;
  }
  TestEnum testEnum = 7;
}

