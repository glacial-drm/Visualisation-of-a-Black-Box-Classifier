image: gradle:alpine

before_script:
  - apk add mesa-gl
  - apk add glfw
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME

build:
  stage: build
  tags: [ docker ]
  script: gradle --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

test:
  stage: test
  tags: [ docker ]
  script: gradle check
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  artifacts:
    when: always
    paths:
      - app/build/test-results/test/*.xml
    reports:
      junit: app/build/test-results/test/*.xml

