build:
  stage: build
  tags: [ docker ]
  image: alpine:latest
  script: 
    - >
      apk add --update gradle;
      GRADLE_USER_HOME="$(pwd)/.gradle";
      export GRADLE_USER_HOME;
      gradle --build-cache assemble;
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

test:
  stage: test
  tags: [ docker ]
  image: docker:dind
  script: 
    - |
      dockerd &
      until [ -S /var/run/docker.sock ]
      do
        sleep 1
      done

      docker buildx build \
        --build-arg BASE_IMAGE=alpine:latest \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg BUILD_OPTIMIZATION=3 \
        --build-arg BUILD_TYPE=release \
        --build-arg LLVM_VERSION=17 \
        --build-arg MESA_VERSION=24.2.6 \
        --build-arg VCS_REF=$(git rev-parse --short HEAD) \
        --cache-from utensils/opengl \
        --tag utensils/opengl \
        --platform=linux/amd64 \
        --progress=auto \
        --file Dockerfile .;

      docker run --rm -v ./:/src -i utensils/opengl "cd /src; gradle check";
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  artifacts:
    when: always
    paths:
      - app/build/test-results/test/*.xml
    reports:
      junit: app/build/test-results/test/*.xml

